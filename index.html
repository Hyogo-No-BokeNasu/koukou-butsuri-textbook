<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="高等学校 物理基礎・物理 全5編16節のインタラクティブ・デジタル教科書。公式・図・シミュレーター・例題・確認問題つき。" />
  <link rel="icon" href="data:," />
  <title>高等学校 物理 ― インタラクティブ・デジタル教科書</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f3f6fb;
      --bg-paper: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-callout: #eff6ff;
      --bg-example: #f0fdf4;
      --bg-column: #fffbeb;
      --bg-pitfall: #fff1f2;
      --text-main: #1e293b;
      --text-muted: #475569;
      --text-light: #64748b;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --accent-dark: #1e40af;
      --success: #0f766e;
      --success-soft: #ccfbf1;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --danger: #be123c;
      --danger-soft: #ffe4e6;
      --font-sans: 'Inter', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', Georgia, serif;
      --font-scale: 1;
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.07);
    }

    [data-theme="paper"] {
      --bg-app: #ece6d9;
      --bg-paper: #fcf9f2;
      --bg-sidebar: #f7f3e8;
      --bg-subtle: #f3ede0;
      --bg-callout: #eef4f9;
      --bg-example: #eff6f1;
      --bg-column: #f9f1db;
      --bg-pitfall: #faecee;
      --text-main: #292524;
      --text-muted: #57534e;
      --border-color: #dfd6c3;
    }

    [data-theme="dark"] {
      --bg-app: #0b1120;
      --bg-paper: #1e293b;
      --bg-sidebar: #131c2e;
      --bg-subtle: #263348;
      --bg-callout: #172554;
      --bg-example: #122b26;
      --bg-column: #2c2416;
      --bg-pitfall: #3b121e;
      --text-main: #f1f5f9;
      --text-muted: #cbd5e1;
      --text-light: #94a3b8;
      --border-color: #334155;
      --accent-soft: #1e3a8a;
      --accent-dark: #93c5fd;
      --success: #2dd4bf;
      --success-soft: #134e4a;
      --warn: #fbbf24;
      --warn-soft: #451a03;
      --danger: #fb7185;
      --danger-soft: #4c0519;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.75;
      height: 100%;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }

    [data-theme="paper"] .topbar { background: rgba(247, 243, 232, 0.94); }
    [data-theme="dark"] .topbar { background: rgba(19, 28, 46, 0.92); }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 60px;
      padding: 0 18px;
      max-width: 1460px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-light);
      display: block;
      line-height: 1.2;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 40px;
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-paper);
      color: var(--text-main);
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: var(--font-sans);
    }

    .tool-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .tool-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .tool-btn.redsheet-active {
      background: #e11d48;
      border-color: #e11d48;
      color: #ffffff;
    }

    /* Main workspace */
    .workspace {
      display: flex;
      flex: 1;
      max-width: 1460px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    /* Sidebar TOC */
    .sidebar {
      width: 316px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      height: calc(100vh - 60px);
      height: calc(100dvh - 60px);
      position: sticky;
      top: 60px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px 36px;
      transition: transform 0.25s ease;
    }

    .sidebar-search {
      position: relative;
      margin-bottom: 12px;
    }

    .sidebar-search input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 13px;
      font-family: var(--font-sans);
      -webkit-appearance: none;
    }

    .sidebar-search input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .sidebar-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
      font-size: 14px;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .filter-pill {
      flex: 1;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-family: var(--font-sans);
      transition: all 0.15s;
    }

    .filter-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    .progress-summary {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 16px;
      font-size: 12px;
    }

    .progress-bar-track {
      height: 7px;
      background: var(--border-color);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #0d9488);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .unit-group { margin-bottom: 14px; }

    .unit-header {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-light);
      padding: 4px 8px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .unit-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .toc-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background-color 0.15s;
      margin-bottom: 2px;
    }

    .toc-item:hover { background: var(--bg-subtle); }

    .toc-item.active {
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 600;
    }

    .toc-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      min-width: 24px;
    }

    .toc-item.active .toc-num { color: var(--accent-dark); }
    .toc-title { flex: 1; line-height: 1.35; }

    .toc-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .badge-kiso { background: #e0f2fe; color: #0369a1; }
    .badge-butsuri { background: #ede9fe; color: #5b21b6; }
    [data-theme="dark"] .badge-kiso { background: #0c4a6e; color: #bae6fd; }
    [data-theme="dark"] .badge-butsuri { background: #3b0764; color: #ddd6fe; }

    .toc-check { color: var(--success); font-size: 13px; font-weight: 700; }

    /* Reader Area */
    .reader-container {
      flex: 1;
      min-width: 0;
      padding: 24px 22px 72px;
    }

    .paper-sheet {
      max-width: 880px;
      margin: 0 auto;
      background: var(--bg-paper);
      border: 1px solid var(--border-color);
      border-top: 6px solid var(--accent);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      padding: 34px 44px 48px;
      font-size: calc(16px * var(--font-scale));
    }

    /* Chapter Header */
    .section-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .section-breadcrumb {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-actions { display: flex; align-items: center; gap: 8px; }

    .section-title {
      font-family: var(--font-serif);
      font-size: calc(28px * var(--font-scale));
      font-weight: 700;
      line-height: 1.35;
      margin: 0 0 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title-num {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-sans);
      font-size: calc(14px * var(--font-scale));
      padding: 4px 11px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    /* Learning Goals Card */
    .goals-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
    }
    .goals-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .goals-list {
      margin: 0;
      padding-left: 20px;
      font-size: calc(14px * var(--font-scale));
      color: var(--text-muted);
    }
    .goals-list li { margin-bottom: 3px; }

    /* Hook Box */
    .hook-box {
      background: linear-gradient(135deg, var(--bg-callout), var(--bg-subtle));
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 15px 18px;
      margin-bottom: 22px;
    }

    .hook-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      display: block;
    }

    /* Pitfall Box */
    .pitfall-box {
      background: var(--bg-pitfall);
      border: 1px solid rgba(190, 18, 60, 0.25);
      border-left: 4px solid var(--danger);
      border-radius: 0 12px 12px 0;
      padding: 14px 18px;
      margin: 22px 0;
      font-size: calc(14.5px * var(--font-scale));
    }
    .pitfall-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--danger);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .prose-heading {
      font-family: var(--font-sans);
      font-size: calc(18.5px * var(--font-scale));
      font-weight: 700;
      color: var(--accent-dark);
      margin: 28px 0 12px;
      padding-left: 12px;
      border-left: 4px solid var(--accent);
      line-height: 1.4;
    }

    .prose-p {
      margin: 0 0 14px;
      text-align: justify;
    }

    /* Comparison Table */
    .compare-table-wrap {
      overflow-x: auto;
      margin: 18px 0;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: calc(13.5px * var(--font-scale));
    }
    .compare-table th {
      background: var(--bg-subtle);
      color: var(--text-main);
      font-weight: 700;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border-color);
    }
    .compare-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
    }
    .compare-table tr:last-child td { border-bottom: none; }

    /* Red-sheet maskable terms */
    .key-term {
      font-weight: 700;
      color: #c2410c;
      background: rgba(251, 146, 60, 0.13);
      padding: 1px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    [data-theme="dark"] .key-term {
      color: #fdba74;
      background: rgba(251, 146, 60, 0.2);
    }

    body.redsheet-on .key-term {
      background: #dc2626 !important;
      color: #dc2626 !important;
      user-select: none;
      -webkit-user-select: none;
    }

    body.redsheet-on .key-term.revealed {
      background: rgba(220, 38, 38, 0.14) !important;
      color: #dc2626 !important;
    }

    /* Formula Box */
    .formula-box {
      background: var(--bg-callout);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0;
    }

    .formula-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .formula-item {
      background: var(--bg-paper);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .formula-item:last-child { margin-bottom: 0; }

    .formula-note {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 6px;
      border-top: 1px dashed var(--border-color);
      padding-top: 6px;
    }

    /* SVG Diagram Container */
    .figure-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin: 22px 0;
      text-align: center;
    }

    .figure-box svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .figure-caption {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 10px;
      font-weight: 600;
    }

    /* Interactive Simulator Box */
    .sim-box {
      background: var(--bg-paper);
      border: 2px solid #0284c7;
      border-radius: 14px;
      padding: 18px;
      margin: 26px 0;
      box-shadow: var(--shadow-sm);
    }

    .sim-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sim-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c7;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
    }

    .sim-canvas-wrap {
      position: relative;
      width: 100%;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .sim-canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 280px;
    }

    .sim-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .sim-control-item label {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border-color);
      border-radius: 999px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }

    .sim-readout {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-subtle);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      border: 1px solid var(--border-color);
    }

    .sim-readout span { font-weight: 600; }

    .sim-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* Example Problem Box */
    .example-box {
      background: var(--bg-example);
      border: 1px solid #0f766e;
      border-radius: 12px;
      padding: 18px 20px;
      margin: 24px 0;
    }

    .example-header {
      display: inline-block;
      background: #0f766e;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 11px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .solution-toggle {
      margin-top: 12px;
      background: var(--bg-paper);
      border: 1px solid #0f766e;
      color: var(--success);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-sans);
    }

    .solution-body {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed rgba(15, 118, 110, 0.35);
      font-size: calc(15px * var(--font-scale));
    }

    /* Practice Quiz Box */
    .quiz-box {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 18px 20px;
      margin: 22px 0;
    }

    .quiz-badge {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 11px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .quiz-options { display: grid; gap: 8px; margin: 12px 0; }

    .quiz-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-paper);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.15s;
    }

    .quiz-option:hover { border-color: var(--accent); }
    .quiz-option.selected-correct { border-color: var(--success); background: var(--success-soft); }
    .quiz-option.selected-wrong { border-color: var(--danger); background: var(--danger-soft); }

    .quiz-feedback {
      margin-top: 10px;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13.5px;
    }

    .quiz-feedback.ok { background: var(--success-soft); border-left: 4px solid var(--success); }

    .math-display {

      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 3px;
      font-size: 0.9em;
      line-height: 1.15;

      display: inline-flex;
      align-items: center;
      vertical-align: middle;
    }
    .math-sqrt-rad { font-size: 1.15em; margin-right: 1px; }
    .math-sqrt-body { border-top: 1.2px solid currentColor; padding: 1px 3px 0; }
    .math-vec { display: inline-block; position: relative; }
    .math-vec::before {
      content: "→";
      position: absolute;
      top: -0.65em;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.65em;
      line-height: 1;

    /* Mobile Drawer */
    .mobile-menu-btn { display: none; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .quiz-option { min-height: 44px; }

      .paper-sheet { box-shadow: none; border: none; max-width: none; }
      .solution-body { display: block !important; }
      body { background: #fff; }

    @media (max-width: 960px) {
      .mobile-menu-btn { display: inline-flex; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 60px;

    /* Mobile header: two rows (brand row + wrapping toolbar) so nothing is squeezed or clipped */
    @media (max-width: 960px) {

        overflow-x: visible;
      }
      /* Closed drawer is fully removed from layout until opened from the menu button */
      .sidebar { display: none; }
      .sidebar.open { display: block; }
    }
  </style>
</head>

<script>
(() => {
  const raw = String.raw;

  const UNIT_THEMES = {
    "第1編 力学": { color: "#2563eb", soft: "#dbeafe", dark: "#1e40af" },
    "第2編 熱力学": { color: "#ea580c", soft: "#ffedd5", dark: "#9a3412" },
    "第3編 波動": { color: "#0d9488", soft: "#ccfbf1", dark: "#115e59" },
    "第4編 電磁気": { color: "#4f46e5", soft: "#e0e7ff", dark: "#3730a3" },
    "第5編 原子": { color: "#be185d", soft: "#fce7f3", dark: "#9d174d" }
  };

  const SECTIONS = [
    // ==================== 第1編 力学 ====================
    {
      id: "sec1",
      unit: "第1編 力学",
      num: "1-1",
      level: "kiso",
      title: "運動の表し方と落体の運動",
      goals: [
        "速度と加速度の意味を区別し、v-tグラフの傾きと面積から運動を読み取れる。",
        "等加速度直線運動の3公式を状況に応じて使い分けられる。",
        "水平投射・斜方投射を水平方向と鉛直方向に分解して計算できる。"
      ],
      hook: "ビルから同時に落とした重い鉄球と軽いプラスチック球（空気抵抗を無視できるとき）は、どちらが先に地面に着くでしょうか？",
      formulas: [
        { name: "等加速度直線運動の3公式", tex: raw`v = v_0 + at, \quad x = v_0 t + \frac{1}{2}at^2, \quad v^2 - v_0^2 = 2ax`, note: raw`$v_0$：初速度 $[\mathrm{m/s}]$、$a$：加速度 $[\mathrm{m/s^2}]$、$t$：時間 $[\mathrm{s}]$、$x$：変位 $[\mathrm{m}]$` },
        { name: "斜方投射の位置・速度", tex: raw`x = (v_0\cos\theta)t, \quad y = (v_0\sin\theta)t - \frac{1}{2}gt^2`, note: raw`$g \approx 9.8\,\mathrm{m/s^2}$（重力加速度）、$\theta$：水平面からの投射角` }
      ],
      body: raw`
        <h3 class="prose-heading">1. 位置・変位・速度と加速度</h3>
        <p class="prose-p">物体の運動を数式で表すには、まず座標軸を定めます。時刻 $t_1$ から $t_2$ の間に位置が $x_1$ から $x_2$ へ変化したとき、位置の変化量 $\Delta x = x_2 - x_1$ を<span class="key-term">変位</span>といいます。移動距離（道のり）とは異なり、変位は向きを含むベクトル量です。</p>
        <p class="prose-p">単位時間あたりの変位が<span class="key-term">速度</span> $v = \frac{\Delta x}{\Delta t}$、単位時間あたりの速度の変化が<span class="key-term">加速度</span> $a = \frac{\Delta v}{\Delta t}$（単位：$\mathrm{m/s^2}$）です。加速度が一定の直線運動を<span class="key-term">等加速度直線運動</span>と呼びます。</p>
        <h3 class="prose-heading">2. $v$-$t$グラフから公式を導く</h3>
        <p class="prose-p">横軸に時間 $t$、縦軸に速度 $v$ をとった<span class="key-term">$v$-$t$グラフ</span>では、<strong>傾きが加速度 $a$</strong>、<strong>グラフと時間軸で囲まれた台形の面積が変位 $x$</strong> を表します。台形の面積公式「$\frac{1}{2}(\text{上底}+\text{下底})\times\text{高さ}$」に $v_0$、$v_0+at$、$t$ を代入すると、公式 $x = v_0 t + \frac{1}{2}at^2$ が自然に導かれます。</p>
        <div class="figure-box">
          <svg viewBox="0 0 560 200" width="560" height="200" aria-label="v-tグラフの傾きと面積">
            <g transform="translate(35,20)">
              <polygon points="30,110 190,40 190,140 30,140" fill="rgba(37,99,235,0.14)"/>
              <line x1="30" y1="140" x2="220" y2="140" stroke="#475569" stroke-width="2"/>
              <line x1="30" y1="140" x2="30" y2="10" stroke="#475569" stroke-width="2"/>
              <line x1="30" y1="110" x2="190" y2="40" stroke="#2563eb" stroke-width="3"/>
              <line x1="30" y1="110" x2="190" y2="110" stroke="#94a3b8" stroke-dasharray="4 3"/>
              <line x1="190" y1="40" x2="190" y2="140" stroke="#94a3b8" stroke-dasharray="4 3"/>
              <text x="225" y="144" font-size="13" fill="#475569" font-weight="600">t</text>
              <text x="16" y="16" font-size="13" fill="#475569" font-weight="600">v</text>
              <text x="10" y="114" font-size="12" fill="#1e293b">v₀</text>
              <text x="186" y="156" font-size="12" fill="#1e293b">t</text>
              <text x="88" y="130" font-size="12" fill="#2563eb" font-weight="700">面積 = 変位 x</text>
              <text x="100" y="62" font-size="12" fill="#be123c" font-weight="700">傾き = 加速度 a</text>
            </g>
            <g transform="translate(310,20)">
              <line x1="20" y1="140" x2="220" y2="140" stroke="#475569" stroke-width="2"/>
              <line x1="20" y1="140" x2="20" y2="10" stroke="#475569" stroke-width="2"/>
              <path d="M 20 140 Q 110 10 200 140" fill="none" stroke="#0284c7" stroke-width="3"/>
              <circle cx="65" cy="76" r="5" fill="#0284c7"/>
              <line x1="65" y1="76" x2="105" y2="76" stroke="#0f766e" stroke-width="2"/>
              <line x1="65" y1="76" x2="65" y2="48" stroke="#be123c" stroke-width="2"/>
              <text x="108" y="80" font-size="11" fill="#0f766e" font-weight="700">vₓ = v₀cosθ (一定)</text>
              <text x="72" y="48" font-size="11" fill="#be123c" font-weight="700">vᵧ</text>
              <text x="90" y="156" font-size="12" fill="#475569">水平方向：等速直線運動</text>
            </g>
          </svg>
          <div class="figure-caption">図1.1　$v$-$t$グラフの傾きと面積（左）および斜方投射の速度分解（右）</div>
        </div>
        <h3 class="prose-heading">3. 落体の運動と放物運動</h3>
        <p class="prose-p">空気抵抗が無視できるとき、すべての物体は質量によらず一定の<span class="key-term">重力加速度</span> $g \approx 9.8\,\mathrm{m/s^2}$ で落下します。初速度 $0$ で落とす運動が<span class="key-term">自由落下</span>、水平方向に初速度を与えて投げる運動が<span class="key-term">水平投射</span>、斜め上向きに投げる運動が<span class="key-term">斜方投射</span>です。放物運動では「水平方向＝等速直線運動」「鉛直方向＝等加速度直線運動」として独立に解くのが鉄則です。</p>
        <div class="pitfall-box">
          <div class="pitfall-title">⚠️ つまずき注意！正の向きの決め方と符号</div>
          鉛直投げ上げや斜方投射では、最初に「上向きを正」と決めたら、重力加速度は下向きなので必ず <strong>$a = -g$</strong> と負の符号をつけます。最高点では一瞬だけ $v_y = 0$ になりますが、加速度は $0$ ではなく $-g$ のままです。
        </div>
      `,
      simId: "sim-projectile",
      example: {
        q: raw`地上から初速度 $v_0 = 19.6\,\mathrm{m/s}$ で、水平面と $30^\circ$ の角をなす斜め上向きに小球を投げた。重力加速度の大きさを $g = 9.8\,\mathrm{m/s^2}$ として、最高点の高さ $H$ と水平到達距離 $R$ を求めよ。`,
        a: raw`<strong>【Step 1：初速度を分解する】</strong><br>
        水平成分：$v_{0x} = 19.6\cos 30^\circ = 9.8\sqrt{3}\,\mathrm{m/s}$、鉛直成分：$v_{0y} = 19.6\sin 30^\circ = 9.8\,\mathrm{m/s}$。<br>
        <strong>【Step 2：最高点の高さ $H$】</strong><br>
        最高点では $v_y = 0$ より $0^2 - 9.8^2 = -2 \times 9.8 \times H \implies H = \mathbf{4.9\,\mathrm{m}}$。<br>
        <strong>【Step 3：滞空時間 $T$ と水平到達距離 $R$】</strong><br>
        最高点までの時間 $t_1$ は $0 = 9.8 - 9.8t_1 \implies t_1 = 1.0\,\mathrm{s}$。対称性より全滞空時間は $T = 2.0\,\mathrm{s}$。よって $R = v_{0x}T = 9.8\sqrt{3}\times 2.0 \approx \mathbf{33.9\,\mathrm{m}}$。`
      },
      quizzes: [
        {
          q: raw`【基礎】自由落下を始めた物体が、落下開始から $3.0\,\mathrm{s}$ 間に落下する距離は何 $\mathrm{m}$ か。（$g = 9.8\,\mathrm{m/s^2}$）`,
          options: ["14.7 m", "29.4 m", "44.1 m", "88.2 m"],
          answer: 2,
          exp: raw`自由落下の変位は $y = \frac{1}{2}gt^2 = \frac{1}{2} \times 9.8 \times 3.0^2 = 4.9 \times 9 = 44.1\,\mathrm{m}$ です。`
        },
        {
          q: raw`【応用】初速度 $v_0$ で斜方投射するとき、空気抵抗を無視すれば水平到達距離 $R$ が最大になる投射角 $\theta$ は何度か。`,
          options: ["30°", "45°", "60°", "75°"],
          answer: 1,
          exp: raw`水平到達距離は $R = \frac{v_0^2 \sin 2\theta}{g}$ と表せるため、$\sin 2\theta = 1$ となる $\theta = 45^\circ$ のとき最大になります。`
        }
      ],
      column: "ガリレオ・ガリレイはピサの斜塔の思考実験や斜面を転がる球の実験によって、重い物体も軽い物体も同じ加速度で落下することを見抜き、近代物理学の基礎を築きました。"
    },
    {
      id: "sec2",
      unit: "第1編 力学",
      num: "1-2",
      level: "kiso",
      title: "力と運動の法則",
      goals: [
        "物体にはたらく力を漏れなく図示し、合力とつりあいの式を立てられる。",
        "ニュートンの運動の3法則（慣性・運動方程式・作用反作用）を説明できる。",
        "静止摩擦力と動摩擦力、弾性力、浮力を運動方程式に組み込める。"
      ],
      hook: "氷の上で押されたパックはなぜ止まらずに滑り続けるのに、床の上の箱はすぐに止まってしまうのでしょうか？",
      formulas: [
        { name: "運動方程式（ニュートンの第2法則）", tex: raw`m\vec{a} = \vec{F}`, note: raw`$m$：質量 $[\mathrm{kg}]$、$\vec{a}$：加速度 $[\mathrm{m/s^2}]$、$\vec{F}$：合力 $[\mathrm{N}]$` },
        { name: "フックの法則・摩擦力・浮力", tex: raw`F = kx, \quad f_{\max} = \mu N, \quad f' = \mu' N, \quad F_{\text{浮}} = \rho V g`, note: raw`$k$：ばね定数、$\mu, \mu'$：静止・動摩擦係数、$N$：垂直抗力、$\rho$：流体密度、$V$：排除体積` }
      ],
      body: raw`
        <h3 class="prose-heading">1. 運動の3法則</h3>
        <p class="prose-p"><strong>第1法則（<span class="key-term">慣性の法則</span>）</strong>：物体に力がはたらかないか合力が $0$ のとき、静止している物体は静止し続け、運動している物体は<span class="key-term">等速直線運動</span>を続けます。</p>

        <p class="prose-p">光は波長約 $380\text{〜}780\,\mathrm{nm}$ の<span class="key-term">電磁波（横波）</span>です。ヤングの実験で明暗の縞模様が現れるのは、光が波動として<span class="key-term">回折</span>し<span class="key-term">干渉</span>するためです。また、シャボン玉などの<span class="key-term">薄膜の干渉</span>では、屈折率の小さい媒質から大きい媒質への反射で<strong>位相が $\pi$（半波長分）ずれる</strong>ため、厚さ $d$・屈折率 $n$ の膜の垂直入射での強めあい条件は $2nd = (m + \frac{1}{2})\lambda$ となります。</p>
        <h3 class="prose-heading">2. 全反射とレンズの公式</h3>
        <p class="prose-p">屈折率の大きい媒質から小さい媒質へ光が進むとき、入射角が<span class="key-term">臨界角</span>（$\sin\theta_0 = \frac{n_2}{n_1}$）を超えると光がすべて反射される<span class="key-term">全反射</span>が起こります。</p>
      `,
      example: {
        q: raw`焦点距離 $f = 15\,\mathrm{cm}$ の凸レンズの前方 $30\,\mathrm{cm}$ の位置に物体を置いた。像のできる位置 $b$ と倍率 $m$ を求めよ。`,
        a: raw`<strong>【解答】</strong>$\frac{1}{30} + \frac{1}{b} = \frac{1}{15} \implies \frac{1}{b} = \frac{1}{30}$。よって後方 $\mathbf{30\,\mathrm{cm}}$ に倒立実像ができ、倍率は $m = \frac{30}{30} = \mathbf{1.0\text{倍}}$。`
      },
      quizzes: [
        {
          q: raw`【基礎】ヤングの干渉実験において、赤い光（波長長）を青い光（波長短）に変えると、スクリーン上の明線間隔 $\Delta x$ はどうなるか。`,

          exp: raw`$\Delta x = \frac{L\lambda}{d}$ より明線間隔は波長 $\lambda$ に比例するため、波長の短い青い光にすると間隔は狭くなります。`
        },

  // Self-contained LaTeX-to-HTML Math Renderer (works offline & in Safari/Canvas)
  function texToHtml(tex) {
    let t = tex.trim();
    const sym = {
      "\\\\alpha": "α", "\\\\beta": "β", "\\\\gamma": "γ", "\\\\Delta": "Δ",
      "\\\\varepsilon": "ε", "\\\\theta": "θ", "\\\\lambda": "λ", "\\\\mu": "μ",
      "\\\\nu": "ν", "\\\\pi": "π", "\\\\rho": "ρ", "\\\\Sigma": "Σ",
      "\\\\sum": "∑", "\\\\Phi": "Φ", "\\\\omega": "ω", "\\\\Omega": "Ω",
      "\\\\times": "×", "\\\\cdot": "·", "\\\\approx": "≈", "\\\\implies": "⇒",
      "\\\\le": "≤", "\\\\ge": "≥", "\\\\sin": "sin", "\\\\cos": "cos",
      "\\\\tan": "tan", "\\\\circ": "°", "\\\\propto": "∝", "\\\\div": "÷", "\\\\ln": "ln", "\\\\max": "max", "\\\\min": "min",
      "\\\\quad": "&emsp;", "\\\\left": "", "\\\\right": ""
    };
    t = t.replace(/\\(?:text|mathrm|mathbf)\{([^{}]*)\}/g, "$1");
    t = t.replace(/\\vec\{([^{}]*)\}/g, '<span class="math-vec">$1</span>');
    t = t.replace(/\^\\circ/g, "°");
    t = t.replace(/\\overline\{([^{}]*)\}/g, '<span class="math-over">$1</span>');
    t = t.replace(/\\bar\{([^{}]*)\}/g, '<span class="math-over">$1</span>');
    for (let pass = 0; pass < 2; pass++) {
      t = t.replace(/\\frac\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g,
        '<span class="math-frac"><span class="num">$1</span><span class="den">$2</span></span>');
      t = t.replace(/\\sqrt\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g,
        '<span class="math-sqrt"><span class="math-sqrt-rad">√</span><span class="math-sqrt-body">$1</span></span>');
    }
    for (const [k, v] of Object.entries(sym)) {
      t = t.replace(new RegExp(k + "(?![a-zA-Z])", "g"), v);
    }
    t = t.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
    t = t.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    t = t.replace(/_([a-zA-Z0-9])/g, "<sub>$1</sub>");
    t = t.replace(/\^([a-zA-Z0-9])/g, "<sup>$1</sup>");
    t = t.replace(/\\,/g, "&thinsp;");
    t = t.replace(/[{}]/g, "");
    return t;
  }

  function renderMath(el) {
    if (!el) return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) {
      if (n.parentElement && (n.parentElement.tagName === "SCRIPT" || n.parentElement.tagName === "STYLE" || n.parentElement.tagName === "TEXTAREA")) continue;
      if (n.nodeValue && n.nodeValue.includes("$")) nodes.push(n);
    }
    nodes.forEach(textNode => {
      const val = textNode.nodeValue;
      const parts = val.split(/(\$\$[\s\S]+?\$\$|\$[^$]+?\$)/g);
      if (parts.length <= 1) return;
      const frag = document.createDocumentFragment();
      parts.forEach(part => {
        if (part.startsWith("$$") && part.endsWith("$$")) {
          const span = document.createElement("div");
          span.className = "math-display";
          span.innerHTML = texToHtml(part.slice(2, -2));
          frag.appendChild(span);
        } else if (part.startsWith("$") && part.endsWith("$")) {
          const span = document.createElement("span");
          span.className = "math-inline";
          span.innerHTML = texToHtml(part.slice(1, -1));
          frag.appendChild(span);
        } else if (part) {
          frag.appendChild(document.createTextNode(part));
        }
      });
      textNode.parentNode.replaceChild(frag, textNode);
    });
  }

  // ==================== 5 Interactive Simulators (HiDPI Safari-ready) ====================
  function setupCanvas(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width || 600, 300);
    const h = 280;
    const tw = Math.round(w * dpr), th = Math.round(h * dpr);
    if (canvas.width !== tw || canvas.height !== th) {
      canvas.width = tw;
      canvas.height = th;
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }

  function initSimulator(simId) {
    const box = document.getElementById("simContainer");
    if (!box) return;

    if (simId === "sim-projectile") {
      box.innerHTML = `
        <div class="sim-header">
          <span class="sim-badge">🧪 デジタル実験：斜方投射シミュレータ</span>
          <span style="font-size:12px; color:var(--text-light);">スライダーで角度と初速度を変えてみよう</span>
        </div>
        <div class="sim-canvas-wrap"><canvas id="simCanvas"></canvas></div>
        <div class="sim-controls">
          <div class="sim-control-item">
            <label><span>初速度 v₀</span><span id="valV0">24 m/s</span></label>
            <input id="ctrlV0" type="range" min="10" max="35" step="1" value="24" />
          </div>
          <div class="sim-control-item">
            <label><span>投射角 θ</span><span id="valAng">45°</span></label>
            <input id="ctrlAng" type="range" min="15" max="80" step="1" value="45" />
          </div>
          <div class="sim-control-item">
            <label><span>重力加速度 g</span><span id="valG">9.8 m/s²</span></label>
            <input id="ctrlG" type="range" min="1.6" max="15" step="0.2" value="9.8" />
          </div>
        </div>
        <div id="simReadout" class="sim-readout"></div>
        <div class="sim-btn-row">
          <button id="simPlayBtn" class="tool-btn active">▶ 発射 / リセット</button>
        </div>
      `;
      let t = 0; let running = true;
      const canvas = document.getElementById("simCanvas");
      const getP = () => ({
        v0: Number(document.getElementById("ctrlV0").value),
        ang: Number(document.getElementById("ctrlAng").value) * Math.PI / 180,
        g: Number(document.getElementById("ctrlG").value)
      });
      const updateLabels = () => {
        const p = getP();
        document.getElementById("valV0").textContent = `${p.v0} m/s`;
        document.getElementById("valAng").textContent = `${Math.round(p.ang * 180 / Math.PI)}°`;
        document.getElementById("valG").textContent = `${p.g.toFixed(1)} m/s²`;
        const vx = p.v0 * Math.cos(p.ang), vy = p.v0 * Math.sin(p.ang);
        const T = 2 * vy / p.g, H = (vy * vy) / (2 * p.g), R = vx * T;
        document.getElementById("simReadout").innerHTML = `
          <span>最高点 H: ${H.toFixed(1)} m</span>
          <span>水平到達距離 R: ${R.toFixed(1)} m</span>
          <span>滞空時間 T: ${T.toFixed(2)} s</span>
        `;
      };
      ["ctrlV0", "ctrlAng", "ctrlG"].forEach(id => {
        document.getElementById(id).addEventListener("input", () => { t = 0; updateLabels(); });
      });
      document.getElementById("simPlayBtn").addEventListener("click", () => { t = 0; running = true; });
      updateLabels();
      function loop() {
        const { ctx, w, h } = setupCanvas(canvas);
        const p = getP();
        const vx = p.v0 * Math.cos(p.ang), vy0 = p.v0 * Math.sin(p.ang), T = 2 * vy0 / p.g;
        const scale = Math.min((w - 60) / 140, (h - 50) / 70), ox = 36, oy = h - 30;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(148,163,184,0.16)"; ctx.lineWidth = 1;
        for (let gx = 0; gx <= 140; gx += 20) { ctx.beginPath(); ctx.moveTo(ox + gx * scale, 10); ctx.lineTo(ox + gx * scale, oy); ctx.stroke(); }
        ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(10, oy); ctx.lineTo(w - 10, oy); ctx.stroke();
        ctx.strokeStyle = "rgba(56, 189, 248, 0.5)"; ctx.setLineDash([5, 4]); ctx.beginPath();
        for (let s = 0; s <= T; s += T / 60) {
          const px = ox + vx * s * scale, py = oy - (vy0 * s - 0.5 * p.g * s * s) * scale;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke(); ctx.setLineDash([]);
        const curT = Math.min(t, T), bx = ox + vx * curT * scale, by = oy - (vy0 * curT - 0.5 * p.g * curT * curT) * scale;
        ctx.fillStyle = "#f59e0b"; ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI * 2); ctx.fill();
        const vyNow = vy0 - p.g * curT;
        ctx.strokeStyle = "#34d399"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + vx * 1.4, by); ctx.stroke();
        ctx.strokeStyle = "#fb7185"; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by - vyNow * 1.4); ctx.stroke();
        if (running) { t += 0.035; if (t > T + 0.6) t = 0; }
        activeAnimId = requestAnimationFrame(loop);
      }
      activeAnimId = requestAnimationFrame(loop);
    }

    else if (simId === "sim-thermo") {
      box.innerHTML = `
        <div class="sim-header"><span class="sim-badge">🧪 デジタル実験：気体の状態変化 (P-V図)</span></div>
        <div class="sim-canvas-wrap"><canvas id="simCanvas"></canvas></div>
        <div class="sim-controls">
          <div class="sim-control-item">
            <label><span>変化の種類</span></label>
            <select id="ctrlMode" style="width:100%; padding:7px; border-radius:6px; border:1px solid var(--border-color); background:var(--bg-subtle); color:var(--text-main);">
              <option value="isobaric">定圧変化 (P = 一定)</option>
              <option value="isothermal">等温変化 (T = 一定)</option>
              <option value="adiabatic">断熱変化 (Q = 0)</option>
            </select>
          </div>
          <div class="sim-control-item">
            <label><span>体積倍率 V / V₀</span><span id="valVol">1.8 倍</span></label>
            <input id="ctrlVol" type="range" min="0.5" max="2.5" step="0.1" value="1.8" />
          </div>
        </div>
        <div id="simReadout" class="sim-readout"></div>
      `;
      const canvas = document.getElementById("simCanvas");
      function drawThermo() {
        const { ctx, w, h } = setupCanvas(canvas);
        const mode = document.getElementById("ctrlMode").value, rV = Number(document.getElementById("ctrlVol").value);
        document.getElementById("valVol").textContent = `${rV.toFixed(1)} 倍`;
        let P2 = 1.0, T2 = 300, Q = 0, W = 0, dU = 0; const nR = 8.31;
        if (mode === "isobaric") { P2 = 1.0; T2 = 300 * rV; W = nR * 300 * (rV - 1); dU = 1.5 * nR * (T2 - 300); Q = dU + W; }
        else if (mode === "isothermal") { P2 = 1.0 / rV; T2 = 300; W = nR * 300 * Math.log(rV); dU = 0; Q = W; }
        else { P2 = Math.pow(1.0 / rV, 5 / 3); T2 = 300 * Math.pow(1.0 / rV, 2 / 3); dU = 1.5 * nR * (T2 - 300); Q = 0; W = -dU; }
        document.getElementById("simReadout").innerHTML = `<span>温度 T: ${Math.round(T2)} K</span><span>圧力 P: ${P2.toFixed(2)} P₀</span><span>ΔU: ${Math.round(dU)} J</span><span>仕事 W: ${Math.round(W)} J</span><span>吸熱量 Q: ${Math.round(Q)} J</span>`;
        ctx.clearRect(0, 0, w, h);
        const px = 28, py = 65, pw = 180, ph = 130;
        ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 3; ctx.strokeRect(px, py, pw, ph);
        const pisX = px + Math.min(pw - 18, Math.max(20, (rV / 2.6) * pw));
        ctx.fillStyle = "rgba(56, 189, 248, 0.25)"; ctx.fillRect(px + 2, py + 2, pisX - px - 2, ph - 4);
        ctx.fillStyle = "#cbd5e1"; ctx.fillRect(pisX, py + 2, 12, ph - 4);
        ctx.fillStyle = "#f8fafc"; ctx.font = "12px sans-serif"; ctx.fillText("ピストンモデル", px, py - 12);
        const gx = Math.min(w - 230, 250), gy = 230, gw = 200, gh = 175;
        ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx, gy - gh); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.stroke();
        ctx.fillStyle = "#cbd5e1"; ctx.fillText("P", gx - 16, gy - gh + 10); ctx.fillText("V", gx + gw + 6, gy + 4);
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3; ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const vv = 1.0 + (rV - 1.0) * (i / 40);
          let pp = 1.0; if (mode === "isothermal") pp = 1.0 / vv; else if (mode === "adiabatic") pp = Math.pow(1.0 / vv, 5 / 3);
          const cx = gx + (vv / 2.8) * gw, cy = gy - Math.min(gh - 10, (pp / 2.5) * gh);
          if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
        }
        ctx.stroke();
        ctx.fillStyle = "#94a3b8"; ctx.beginPath(); ctx.arc(gx + (1.0 / 2.8) * gw, gy - (1.0 / 2.5) * gh, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f59e0b"; ctx.beginPath(); ctx.arc(gx + (rV / 2.8) * gw, gy - Math.min(gh - 10, (P2 / 2.5) * gh), 6, 0, Math.PI * 2); ctx.fill();
      }
      document.getElementById("ctrlMode").addEventListener("change", drawThermo);
      document.getElementById("ctrlVol").addEventListener("input", drawThermo);
      drawThermo();
    }

    else if (simId === "sim-wave") {
      box.innerHTML = `
        <div class="sim-header"><span class="sim-badge">🧪 デジタル実験：定常波の生成シミュレータ</span></div>
        <div class="sim-canvas-wrap"><canvas id="simCanvas"></canvas></div>
        <div class="sim-controls">
          <div class="sim-control-item"><label><span>波長 λ</span><span id="valLam">160 px</span></label><input id="ctrlLam" type="range" min="80" max="240" step="10" value="160" /></div>
          <div class="sim-control-item"><label><span>振動数 f</span><span id="valFreq">1.0 Hz</span></label><input id="ctrlFreq" type="range" min="0.4" max="2.4" step="0.2" value="1.0" /></div>
        </div>
        <div class="sim-readout"><span style="color:#38bdf8;">━ 右進波</span><span style="color:#34d399;">━ 左進波</span><span style="color:#f59e0b;">━ 合成波（定常波）</span></div>
      `;
      const canvas = document.getElementById("simCanvas"); let t = 0;
      function loop() {
        const { ctx, w, h } = setupCanvas(canvas);
        const lam = Number(document.getElementById("ctrlLam").value), freq = Number(document.getElementById("ctrlFreq").value);
        document.getElementById("valLam").textContent = `${lam} px`; document.getElementById("valFreq").textContent = `${freq.toFixed(1)} Hz`;
        const mid = h / 2, amp = 42;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(148,163,184,0.25)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();
        const drawWave = (color, lw, fn) => {
          ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
          for (let x = 0; x <= w; x += 4) { const y = mid - fn(x); if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
          ctx.stroke();
        };
        const omega = 2 * Math.PI * freq, k = 2 * Math.PI / lam;
        drawWave("rgba(56,189,248,0.6)", 1.5, x => amp * Math.sin(omega * t - k * x));
        drawWave("rgba(52,211,153,0.6)", 1.5, x => amp * Math.sin(omega * t + k * x));
        drawWave("#f59e0b", 3, x => amp * (Math.sin(omega * t - k * x) + Math.sin(omega * t + k * x)));
        t += 0.016; activeAnimId = requestAnimationFrame(loop);
      }
      activeAnimId = requestAnimationFrame(loop);
    }

    else if (simId === "sim-ac") {
      box.innerHTML = `
        <div class="sim-header"><span class="sim-badge">🧪 デジタル実験：RLC交流回路 共振シミュレータ</span></div>
        <div class="sim-canvas-wrap"><canvas id="simCanvas"></canvas></div>
        <div class="sim-controls">
          <div class="sim-control-item"><label><span>電源周波数 f</span><span id="valAcF">50 Hz</span></label><input id="ctrlAcF" type="range" min="10" max="150" step="1" value="50" /></div>
          <div class="sim-control-item"><label><span>抵抗 R</span><span id="valAcR">20 Ω</span></label><input id="ctrlAcR" type="range" min="10" max="100" step="5" value="20" /></div>
        </div>
        <div id="simReadout" class="sim-readout"></div>
      `;
      const canvas = document.getElementById("simCanvas"); let t = 0; const L = 0.10, C = 100e-6;
      function loop() {
        const { ctx, w, h } = setupCanvas(canvas);
        const f = Number(document.getElementById("ctrlAcF").value), R = Number(document.getElementById("ctrlAcR").value);
        document.getElementById("valAcF").textContent = `${f} Hz`; document.getElementById("valAcR").textContent = `${R} Ω`;
        const omega = 2 * Math.PI * f, XL = omega * L, XC = 1 / (omega * C);
        const Z = Math.sqrt(R * R + Math.pow(XL - XC, 2)), Imax = 100 / Z, phi = Math.atan2(XL - XC, R), f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
        document.getElementById("simReadout").innerHTML = `<span>共振周波数 f₀: ${f0.toFixed(1)} Hz</span><span>インピーダンス Z: ${Z.toFixed(1)} Ω</span><span>最大電流 I₀: ${Imax.toFixed(2)} A</span>`;
        ctx.clearRect(0, 0, w, h); const mid = h / 2;
        ctx.strokeStyle = "rgba(148,163,184,0.25)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.beginPath();
        for (let x = 0; x <= w; x += 4) { const y = mid - 70 * Math.sin(x * 0.03 + t); if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
        ctx.stroke();
        ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 3; ctx.beginPath();
        for (let x = 0; x <= w; x += 4) { const y = mid - Math.min(95, Imax * 12) * Math.sin(x * 0.03 + t - phi); if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
        ctx.stroke();
        ctx.fillStyle = "#38bdf8"; ctx.font = "12px sans-serif"; ctx.fillText("電圧 V", 16, 24);
        ctx.fillStyle = "#f59e0b"; ctx.fillText("電流 I（f = f₀ 付近で最大！）", 76, 24);
        t -= 0.05; activeAnimId = requestAnimationFrame(loop);
      }
      activeAnimId = requestAnimationFrame(loop);
    }

    else if (simId === "sim-photo") {
      box.innerHTML = `
        <div class="sim-header"><span class="sim-badge">🧪 デジタル実験：光電効果シミュレータ</span></div>
        <div class="sim-canvas-wrap"><canvas id="simCanvas"></canvas></div>
        <div class="sim-controls">
          <div class="sim-control-item"><label><span>光のエネルギー hν</span><span id="valE">3.5 eV</span></label><input id="ctrlE" type="range" min="1.5" max="5.5" step="0.1" value="3.5" /></div>
          <div class="sim-control-item"><label><span>金属の仕事関数 W</span><span id="valW">2.3 eV</span></label><input id="ctrlW" type="range" min="1.8" max="4.8" step="0.1" value="2.3" /></div>
        </div>
        <div id="simReadout" class="sim-readout"></div>
      `;
      const canvas = document.getElementById("simCanvas"); let electrons = []; let tick = 0;
      function loop() {
        const { ctx, w, h } = setupCanvas(canvas);
        const hv = Number(document.getElementById("ctrlE").value), W = Number(document.getElementById("ctrlW").value);
        document.getElementById("valE").textContent = `${hv.toFixed(1)} eV`; document.getElementById("valW").textContent = `${W.toFixed(1)} eV`;
        const Kmax = Math.max(0, hv - W);
        document.getElementById("simReadout").innerHTML = Kmax > 0
          ? `<span style="color:var(--success);">光電子放出あり！ 最大運動エネルギー K_max = ${Kmax.toFixed(1)} eV</span>`
          : `<span style="color:var(--danger);">hν ≤ W のため、光電子は飛び出しません</span>`;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#64748b"; ctx.fillRect(40, 40, 24, 200);
        ctx.fillStyle = "#94a3b8"; ctx.fillRect(w - 64, 40, 14, 200);
        const beamColor = hv < 2.1 ? "#ef4444" : hv < 2.7 ? "#22c55e" : hv < 3.2 ? "#3b82f6" : "#a855f7";
        ctx.strokeStyle = beamColor; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(180, 15); ctx.lineTo(64, 140); ctx.stroke();
        if (Kmax > 0 && tick % 12 === 0) electrons.push({ x: 66, y: 80 + Math.random() * 120, vx: 1.5 + Kmax * 1.4 });
        ctx.fillStyle = "#38bdf8"; electrons = electrons.filter(e => e.x < w - 64);
        electrons.forEach(e => { e.x += e.vx; ctx.beginPath(); ctx.arc(e.x, e.y, 4, 0, Math.PI * 2); ctx.fill(); });
        tick++; activeAnimId = requestAnimationFrame(loop);
      }
      activeAnimId = requestAnimationFrame(loop);
    }
  }

  function openFormulaModal() {
    document.getElementById("modalTitle").textContent = "📐 高校物理 公式一覧（全5編16節）";
    const body = document.getElementById("modalBody");
    body.innerHTML = `<div class="formula-grid">` + SECTIONS.map(s => `
      <div class="formula-card" data-jump-id="${s.id}">
        <div style="font-size:11.5px; color:${(UNIT_THEMES[s.unit]||{}).color || "var(--accent)"}; font-weight:700;">${s.num} ${s.title}</div>
        ${s.formulas.map(f => `<div style="margin-top:6px; font-size:13px;"><strong>${f.name}</strong><div style="overflow-x:auto;">$$${f.tex}$$</div></div>`).join("")}
      </div>
    `).join("") + `</div>`;
    renderMath(body);
    body.querySelectorAll("[data-jump-id]").forEach(el => {
      el.addEventListener("click", () => { closeModal(); renderSection(el.getAttribute("data-jump-id")); });
    });
    document.getElementById("modalBackdrop").classList.add("open");
  }

  function openBookmarkModal() {
    document.getElementById("modalTitle").textContent = "🔖 しおり（ブックマーク）一覧";
    const body = document.getElementById("modalBody");
    if (state.bookmarks.length === 0) {
      body.innerHTML = `<p style="color:var(--text-light); text-align:center; padding:24px;">まだしおりが登録されていません。各単元右上の「しおり」ボタンから登録できます。</p>`;
    } else {
      body.innerHTML = state.bookmarks.map(id => {
        const s = SECTIONS.find(x => x.id === id);
        if (!s) return "";
        return `<div class="formula-card" style="margin-bottom:8px;" data-jump-id="${s.id}">
          <strong>${s.num} ${s.title}</strong> <span style="font-size:12px; color:var(--text-light);">(${s.unit})</span>
        </div>`;
      }).join("");
      body.querySelectorAll("[data-jump-id]").forEach(el => {
        el.addEventListener("click", () => { closeModal(); renderSection(el.getAttribute("data-jump-id")); });
      });
    }
    document.getElementById("modalBackdrop").classList.add("open");
  }

  function closeModal() { document.getElementById("modalBackdrop").classList.remove("open"); }

  loadState();
  applyAppearance();

  document.getElementById("tocList").addEventListener("click", (e) => {
    const btn = e.target.closest(".toc-item");
    if (!btn) return;
    renderSection(btn.getAttribute("data-sec-id"));
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.getElementById("tocSearch").addEventListener("input", (e) => { state.search = e.target.value; renderTOC(); });

  document.querySelectorAll(".filter-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.filter = btn.getAttribute("data-filter");
      renderTOC();
    });
  });

  document.getElementById("redSheetBtn").addEventListener("click", () => { state.redSheet = !state.redSheet; saveState(); applyAppearance(); });
  document.getElementById("fontSizeBtn").addEventListener("click", () => { state.fontScaleIndex = (state.fontScaleIndex + 1) % FONT_SCALES.length; saveState(); applyAppearance(); });
  document.getElementById("themeBtn").addEventListener("click", () => {
    const idx = THEMES.findIndex(t => t.id === state.theme);
    state.theme = THEMES[(idx + 1) % THEMES.length].id;
    saveState(); applyAppearance(); applyUnitAccent((SECTIONS.find(s => s.id === state.currentId) || SECTIONS[0]).unit);
  });

  document.getElementById("formulaModalBtn").addEventListener("click", openFormulaModal);
  document.getElementById("bookmarkFilterBtn").addEventListener("click", openBookmarkModal);
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeModal();
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarOverlay").classList.remove("open");
    }
  });

  document.getElementById("menuToggleBtn").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
  });
  document.getElementById("sidebarOverlay").addEventListener("click", () => {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
  });

  renderSection(state.currentId);
})();
</script>
</body>
</html>
